<!DOCTYPE html>
<html>

<head>

  <titleMeenaik 2DTanjore Painting</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap" rel="stylesheet">

</head>

<body data-course-config="/json/courses/ganeshadiya_paths.json">



  <div class="container">
<div id="site-header"></div>
    <!-- TITLE -->
  <h3 id="course-title" class="chelsea-market-regular"></h3>
  <img id="course-thumbnail" width="300px" height="200px" alt="Course thumbnail">
</div>

   <!-- DOCUMENTS -->
<div class="step-card">
  <button class="step-toggle">Documents</button>

  <div class="step-content hidden" id="course-documents">
  </div>
</div>

   
<!-- VIDEOS -->
<div class="step-card">
  <button class="step-toggle">Videos</button>

  <div class="step-content hidden" id="course-videos">
  </div>
</div>


    
<!-- IMAGES -->
<div class="step-card">
  <button class="step-toggle">Images</button>

  <div class="step-content hidden">
    <div id="course-images" class="course-galleries"></div>
  </div>
</div>

<!-- IMAGE LIGHTBOX -->
<div id="lightbox" class="lightbox hidden"
     role="dialog"
     aria-modal="true"
     aria-label="Image gallery">

  <!-- Close -->
  <button id="close-lightbox"
          class="lightbox-close"
          type="button"
          aria-label="Close image">
    &times;
  </button>

  <!-- Previous image -->
  <button id="prev-image"
          class="gallery-arrow gallery-prev"
          type="button"
          aria-label="Previous image">
    &#10094;
  </button>

  <!-- Display image -->
  <img id="lightbox-img" src="" alt="">

  <!-- Next image -->
  <button id="next-image"
          class="gallery-arrow gallery-next"
          type="button"
          aria-label="Next image">
    &#10095;
  </button>

  <!-- Image counter -->
  <div id="image-counter" class="image-counter"></div>

</div>


  </div>

<div id="site-footer"></div>
<script type="module" src="/js/header_footer.js"></script>

  <!-- MAIN SCRIPT -->
  <script src="../js/script.js"></script>

  <!-- STEP TOGGLES -->
  <script>

    const toggleButtons =
      document.querySelectorAll(".step-toggle");

    toggleButtons.forEach(button => {

      button.addEventListener("click", () => {

        const content =
          button.nextElementSibling;

        content.classList.toggle("hidden");

      });

    });

  </script>
<script type="module" src="../js/course-content.js"></script>
</body>
</html>
