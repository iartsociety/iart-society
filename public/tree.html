<!DOCTYPE html>
<html>

<head>

  <titleTree of Life</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap" rel="stylesheet">

</head>

<body>

  <!-- CORNER LOGO -->
  <img
    class="corner-logo"
    src="images/iArtSocietyLogo.png"
    alt="logo"
  >

  <div class="container">

    <!-- TITLE -->
    <div class="introgreentext">

      <h3 class="chelsea-market-regular">
        Tree of Life - Kalamkari
      </h3>

    </div>

    <!-- DOCUMENTS -->
    <div class="step-card">

      <button class="step-toggle">
        Documents
      </button>

      <div class="step-content hidden">

        <h2>
          Documents Coming Soon
        </h2>

      </div>

    </div>

    <!-- VIDEOS -->
    <div class="step-card">

      <button class="step-toggle">
        Videos
      </button>

      <div class="step-content hidden">

        <h2>
          Videos Coming Soon
        </h2>

      </div>

    </div>

    <!-- IMAGES -->
    <div class="step-card">

      <button class="step-toggle">
        Images
      </button>

      <div class="step-content hidden">

      
<div
  class="horizontal-gallery"
  data-gallery="tree">
</div>


      </div>

    </div>

  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox hidden">

    <span id="close-lightbox">&times;</span>

    <img
      id="lightbox-img"
      src=""
      alt=""
    >

  </div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav">

    <a href="index.html">
      Home
    </a>

    <a href="courses.html">
      My Courses
    </a>

  </nav>

  <!-- MAIN SCRIPT -->
  <script src="js/script.js"></script>

  <!-- STEP TOGGLES -->
  <script>

    const toggleButtons =
      document.querySelectorAll(".step-toggle");

    toggleButtons.forEach(button => {

      button.addEventListener("click", () => {

        const content =
          button.nextElementSibling;

        content.classList.toggle("hidden");

      });

    });

  </script>
<script type="module" src="/js/gallery.js"></script>
</body>
</html>
