<!DOCTYPE html>
<html>
  <head>
    <title>iArt-Society</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap" rel="stylesheet">

  </head>

   <body class="courses">
<div id="site-header"></div>
    <div class="container">

      <!-- COURSES SECTION -->
      <div id="courses-container"></div>

    </div>

    <!-- ADD COURSE BUTTON -->
    <button id="add-course-btn" class="add-course-btn">
      Add Course +
    </button>

    <!-- POPUP -->
    <div id="course-popup" class="popup hidden">
  <div class="popup-content">

    <button id="close-popup-btn" class="popup-close">×</button>

    <h2>Enter Course Code</h2>

    <input
      type="text"
      id="course-code-input"
      placeholder="Enter code..."
    >

    <button id="submit-code-btn">
      Unlock Course
    </button>

  </div>
</div>
<div id="site-footer"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const addButton = document.getElementById("add-course-btn");
  const popup = document.getElementById("course-popup");
  const closeButton = document.getElementById("close-popup-btn");
  const codeInput = document.getElementById("course-code-input");

  function openPopup() {
    popup.classList.remove("hidden");
    codeInput.focus();
  }

  function closePopup() {
    popup.classList.add("hidden");
    codeInput.value = "";
  }

  addButton.addEventListener("click", openPopup);
  closeButton.addEventListener("click", closePopup);

  popup.addEventListener("click", (event) => {
    if (event.target === popup) closePopup();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePopup();
  });
});
</script>
     <script type="module" src="/js/header_footer.js"></script>
  <script type="module" src="/js/my-courses.js"></script>
    <script type="module" src="js/protect.js"></script>
  </body>
</html>
